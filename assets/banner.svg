<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff0080" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(56, 189, 248, 0.2)"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 800; letter-spacing: -0.5px; }
      .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
      .pulse-circle { animation: pulse 2.5s infinite; transform-origin: center; }
      @keyframes pulse {
        0% { r: 4px; opacity: 1; }
        50% { r: 6.5px; opacity: 0.4; }
        100% { r: 4px; opacity: 1; }
      }
      .spin-slow { animation: rotate 35s linear infinite; transform-origin: 820px 150px; }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="960" height="300" rx="16" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <rect width="960" height="300" rx="16" fill="url(#cyanGlow)"/>
  <rect width="960" height="300" rx="16" fill="url(#purpleGlow)"/>

  <!-- Card Outer Frame -->
  <rect x="1" y="1" width="958" height="298" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top HUD Bar -->
  <g transform="translate(36, 32)">
    <!-- Terminal dots -->
    <circle cx="4" cy="4" r="4" fill="#ff5f56"/>
    <circle cx="20" cy="4" r="4" fill="#ffbd2e"/>
    <circle cx="36" cy="4" r="4" fill="#27c93f"/>

    <text x="60" y="8" fill="#64748b" font-size="11" class="mono" font-weight="500">khaled@workstation: ~/portfolio (main)</text>

    <!-- Status Badge -->
    <g transform="translate(680, -4)">
      <rect x="0" y="0" width="208" height="24" rx="12" fill="#03251e" stroke="#059669" stroke-width="0.8"/>
      <circle cx="16" cy="12" r="4" fill="#10b981" class="pulse-circle"/>
      <text x="28" y="15" fill="#34d399" font-size="10.5" class="mono" font-weight="600" letter-spacing="0.5">AVAILABLE FOR PROJECTS</text>
    </g>
  </g>

  <!-- Subtle Horizontal Divider -->
  <line x1="36" y1="52" x2="924" y2="52" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>

  <!-- Left Content: Hero Text -->
  <g transform="translate(48, 105)">
    <!-- Small Category Label -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-14" width="186" height="22" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <text x="10" y="1" fill="#38bdf8" font-size="10.5" class="mono" font-weight="700" letter-spacing="1">CREATIVE TECH // 3D WEB</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="46" fill="url(#titleGrad)" font-size="44" class="sans title">Khaled Amr</text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#94a3b8" font-size="16.5" class="sans" font-weight="400">
      Frontend Engineer specializing in <tspan fill="#38bdf8" font-weight="600">Three.js</tspan>, <tspan fill="#818cf8" font-weight="600">React Three Fiber</tspan>, and interactive web systems.
    </text>

    <!-- Tech Stack Mini Badges in Banner -->
    <g transform="translate(0, 114)">
      <!-- Three.js Badge -->
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="38" y="16" fill="#f3f4f6" text-anchor="middle" class="mono tag">Three.js</text>

      <!-- R3F -->
      <rect x="84" y="0" width="62" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="115" y="16" fill="#38bdf8" text-anchor="middle" class="mono tag">R3F</text>

      <!-- React -->
      <rect x="154" y="0" width="68" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="188" y="16" fill="#61dafb" text-anchor="middle" class="mono tag">React</text>

      <!-- TypeScript -->
      <rect x="230" y="0" width="94" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="277" y="16" fill="#60a5fa" text-anchor="middle" class="mono tag">TypeScript</text>

      <!-- Vite / Next -->
      <rect x="332" y="0" width="60" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="362" y="16" fill="#c084fc" text-anchor="middle" class="mono tag">Vite</text>

      <!-- Shaders -->
      <rect x="400" y="0" width="86" height="24" rx="6" fill="#111827" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="443" y="16" fill="#f43f5e" text-anchor="middle" class="mono tag">GLSL / AI</text>
    </g>
  </g>

  <!-- Right Side: 3D Wireframe / Celestial Gyroscope Graphic -->
  <g class="spin-slow" opacity="0.85">
    <!-- Outer Ring -->
    <ellipse cx="820" cy="150" rx="90" ry="90" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <!-- Angled Orbit 1 -->
    <ellipse cx="820" cy="150" rx="88" ry="34" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(35 820 150)" opacity="0.7"/>
    <!-- Angled Orbit 2 -->
    <ellipse cx="820" cy="150" rx="88" ry="34" fill="none" stroke="#a855f7" stroke-width="1.2" transform="rotate(-35 820 150)" opacity="0.7"/>
    <!-- Inner Coordinate Axis -->
    <circle cx="820" cy="150" rx="42" ry="42" fill="rgba(15, 23, 42, 0.6)" stroke="#e0f2fe" stroke-width="1" opacity="0.4"/>
    <!-- Central Core -->
    <circle cx="820" cy="150" r="14" fill="url(#titleGrad)" opacity="0.9"/>
    <circle cx="820" cy="150" r="22" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3"/>
    
    <!-- Floating Vertex Nodes -->
    <circle cx="755" cy="105" r="3" fill="#38bdf8"/>
    <circle cx="885" cy="195" r="3" fill="#a855f7"/>
    <circle cx="885" cy="105" r="3.5" fill="#00f2fe"/>
    <circle cx="755" cy="195" r="2.5" fill="#e0f2fe"/>
  </g>

  <!-- Coordinate Overlay on graphic -->
  <g transform="translate(735, 260)">
    <text x="0" y="0" fill="#475569" font-size="9" class="mono" letter-spacing="1">SIM: 3D_CANVAS [R3F_OK]</text>
  </g>
</svg>

